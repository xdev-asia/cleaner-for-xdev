name: Cleaner
options:
  bundleIdPrefix: asia.xdev
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
packages:
  CleanerKit:
    path: .
targets:
  Cleaner:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: CleanerKit
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Cleaner for xDev
        PRODUCT_BUNDLE_IDENTIFIER: asia.xdev.cleaner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cleaner for xDev
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 xDev. MIT License."
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
